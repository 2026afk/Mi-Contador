<!DOCTYPE html>
<html lang="es">
<head>

</head>

    <h1>Mi Contador</h1>

    <div class="tarjeta-perfil" onclick="irAPrincipal()">

      <div class="tipo-perfil">Personal</div>

    <div class="tarjeta-perfil" onclick="irARegistro()">
      <div class="circulo gris">+</div>
      <div class="nombre-perfil">Nuevo perfil</div>
      <div class="tipo-perfil">Crear cuenta</div>

  </div>
